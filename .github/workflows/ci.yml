name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Shellcheck + syntax + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (shellcheck, severity >= warning fails)
        run: shellcheck -S warning bin/stageforge core/*.sh runners/*.sh tests/*.sh
      - name: Syntax, unit tests, and mock E2E
        run: make test

  macos:
    name: Shellcheck + tests (macOS, bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS runner images do not preinstall shellcheck (ubuntu does).
      - name: Install shellcheck
        run: brew install shellcheck
      # The macOS system shell is exactly the bash 3.2 this project targets,
      # so this job is the real compat gate for core/compat.sh.
      - name: Lint (shellcheck, severity >= warning fails)
        run: shellcheck -S warning bin/stageforge core/*.sh runners/*.sh tests/*.sh
      - name: Syntax, unit tests, and mock E2E
        run: make test
