# stageforge.yaml — Project configuration
# Place this file in your project root or specify with -c

# Agent runner: claude-code | codex-cli | /path/to/custom-runner.sh
runner: claude-code

# Model routing — map stages to specific models
# Leave empty to use the runner's default model
models:
  planner: ""
  builder: ""
  reviewer: ""
  consultant: ""

# Pipeline settings
# Per-stage retry budget. A shell environment variable
# STAGEFORGE_MAX_RETRIES takes precedence over this value.
max_retries: 3

# How many times a stage may send the pipeline back to an earlier stage
# (verdict: needs_work). Rollbacks are counted in stages/.rollbacks, which
# is committed to git, so the budget is lifetime per project; delete that
# file to reset it. 0 disables rollback. STAGEFORGE_MAX_ROLLBACKS takes
# precedence.
max_rollbacks: 3
